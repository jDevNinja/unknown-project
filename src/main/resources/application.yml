spring:
  jpa:
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5442/postgres
    driver-class-name: org.postgresql.Driver
    username: user
    password: pass

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type: TRACE
    org.hibernate.orm.jdbc.bind: TRACE
